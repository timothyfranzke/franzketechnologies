<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" mode="multiply" />
    </filter>
    <!-- Paper texture gradients -->
    <radialGradient id="warm1" cx="20%" cy="30%">
      <stop offset="0%" stop-color="#C14A33" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#C14A33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm2" cx="80%" cy="70%">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm3" cx="50%" cy="100%">
      <stop offset="0%" stop-color="#1A2537" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#1A2537" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cream background -->
  <rect width="1200" height="630" fill="#F3E8D2"/>
  <!-- Texture overlays -->
  <rect width="1200" height="630" fill="url(#warm1)"/>
  <rect width="1200" height="630" fill="url(#warm2)"/>
  <rect width="1200" height="630" fill="url(#warm3)"/>

  <!-- Top label -->
  <text x="600" y="160" text-anchor="middle"
    font-family="monospace" font-size="14" font-weight="500"
    fill="#8A7E68" letter-spacing="6" text-transform="uppercase">
    &#9733; A GEOGRAPHY GAME &#9733;
  </text>

  <!-- Title: Fifty -->
  <text x="600" y="280" text-anchor="middle"
    font-family="Georgia, serif" font-size="120" font-weight="900"
    fill="#1A2537" letter-spacing="-2">
    Fifty
  </text>

  <!-- Title: &amp; Capitals -->
  <text x="600" y="380" text-anchor="middle"
    font-family="Georgia, serif" font-size="110" font-weight="900"
    fill="#C14A33" font-style="italic" letter-spacing="-2">
    &amp; Capitals
  </text>

  <!-- Stamp -->
  <g transform="translate(600, 470) rotate(-4)">
    <rect x="-150" y="-20" width="300" height="40" rx="4"
      fill="none" stroke="#C14A33" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle"
      font-family="monospace" font-size="13" font-weight="700"
      fill="#C14A33" letter-spacing="4">
      &#9733; TEST YOUR KNOWLEDGE &#9733;
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="540" text-anchor="middle"
    font-family="monospace" font-size="13" font-weight="500"
    fill="#8A7E68" letter-spacing="5">
    50 STATES &#183; 4 MODES &#183; 1 GOAL
  </text>

  <!-- Attribution -->
  <text x="1160" y="605" text-anchor="end"
    font-family="monospace" font-size="11" font-weight="500"
    fill="#8A7E68" opacity="0.6" letter-spacing="2">
    franzketechnologies.com
  </text>

  <!-- Decorative corners -->
  <text x="60" y="80" font-family="Georgia, serif" font-size="28" fill="#C14A33" opacity="0.25">&#10022;</text>
  <text x="1140" y="80" text-anchor="end" font-family="Georgia, serif" font-size="28" fill="#C14A33" opacity="0.25">&#10022;</text>
  <text x="60" y="590" font-family="Georgia, serif" font-size="28" fill="#C14A33" opacity="0.25">&#10022;</text>
  <text x="1140" y="590" text-anchor="end" font-family="Georgia, serif" font-size="28" fill="#C14A33" opacity="0.25">&#10022;</text>
</svg>
